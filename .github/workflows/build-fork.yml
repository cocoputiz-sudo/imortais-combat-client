name: Build v0.6.1 Candidate (sem publicacao)

on:
  push:
    branches:
      - feat/observe-guild-challenge-points-20261008
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout do commit da branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Conferir versao v0.6.1 e proteger feed publico
        shell: pwsh
        run: |
          $root = "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool"
          $project = Get-Content "$root/StatisticsAnalysisTool.csproj" -Raw
          $assembly = Get-Content "$root/Properties/AssemblyInfo.cs" -Raw
          $bridge = Get-Content "$root/Imortais/ImortaisEventBridge.cs" -Raw
          $feed = Get-Content "$root/imortais-netsparkle-update-check.xml" -Raw
          if ($project -notmatch '<ApplicationVersion>0\.6\.1\.0</ApplicationVersion>') { throw "csproj is not v0.6.1" }
          if ($assembly -notmatch 'AssemblyFileVersion\("0\.6\.1\.0"\)') { throw "assembly is not v0.6.1" }
          if ($bridge -notmatch 'ClientVersion = "0\.6\.1"') { throw "telemetry version mismatch" }
          if ($feed -notmatch 'sparkle:version="0\.6\.0"') { throw "Production appcast must remain on v0.6.0" }
          Write-Host "v0.6.1 candidate, public feed still v0.6.0"

      - name: Carimbar commit Git real no cliente
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $sha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sha -ne $env:EXPECTED_SHA.ToLowerInvariant()) { throw "Checkout does not match event SHA" }
          if ($sha -notmatch '^[a-f0-9]{40}$') { throw "Invalid Git SHA" }
          $target = "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool/Imortais/ImortaisBuildIdentity.cs"
          $code = 'namespace StatisticsAnalysisTool.Imortais; public static class ImortaisBuildIdentity { public const string Version = "v0.6.1"; public const string Commit = "PLACEHOLDER_SHA"; public static string Display => Version + " commit " + Commit; }'
          $code = $code.Replace("PLACEHOLDER_SHA",$sha)
          [System.IO.File]::WriteAllText($target,$code,[System.Text.UTF8Encoding]::new($false))
          Write-Host "BUILD_SHA=$sha"

      - name: Compilar Combat Client Windows
        shell: pwsh
        run: |
          $project = ".\upstream\AlbionOnline-StatisticsAnalysis\src\StatisticsAnalysisTool\StatisticsAnalysisTool.csproj"
          dotnet build $project -c Release --no-incremental
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed" }

      - name: Executar testes de Highlights
        shell: pwsh
        run: |
          dotnet run --project .\tests\Highlights.LogicTests\Highlights.LogicTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Highlights logic tests failed" }

      - name: Publicar executavel v0.6.1 autocontido (nao distribuido)
        shell: pwsh
        run: |
          $project = ".\upstream\AlbionOnline-StatisticsAnalysis\src\StatisticsAnalysisTool\StatisticsAnalysisTool.csproj"
          $out = Join-Path $env:RUNNER_TEMP "imortais-v061-app"
          dotnet publish $project -c Release -r win-x64 --self-contained true -p:LocalInstallerBuild=true -o $out
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          $exe = Join-Path $out "IMORTAIS-Combat-Client.exe"
          if (-not (Test-Path $exe)) { throw "No executable published" }
          if ((Get-Item $exe).VersionInfo.FileVersion -notlike '0.6.1*') { throw "Version not embedded" }
          "APP_DIR=$out" >> $env:GITHUB_ENV

      - name: Gerar instalador normal v0.6.1
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "imortais-v061-setup"
          .\scripts\build-icc-v061-candidate.ps1 -AppDir "$env:APP_DIR" -OutDir $package
          if ($LASTEXITCODE -ne 0) { throw "Inno setup failed" }
          "PACKAGE_DIR=$package" >> $env:GITHUB_ENV

      - name: Anexar instalador v0.6.1 para conferência, sem Release
        uses: actions/upload-artifact@v4
        with:
          name: IMORTAIS-Combat-Client-Setup-v0.6.1
          path: ${{ env.PACKAGE_DIR }}\*
          if-no-files-found: error
          retention-days: 14
