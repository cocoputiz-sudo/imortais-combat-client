name: Build fork Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Guard IMORTAIS canonical integration and home screen
        shell: pwsh
        run: |
          $root = ".\upstream\AlbionOnline-StatisticsAnalysis\src\StatisticsAnalysisTool"
          $main = Get-Content "$root\Views\MainWindow.xaml" -Raw
          $bridge = Get-Content "$root\Imortais\ImortaisEventBridge.cs" -Raw
          $config = Get-Content "$root\Imortais\ImortaisTelemetryConfig.cs" -Raw
          $loot = Get-Content "$root\Network\Manager\LootController.cs" -Raw
          $updater = Get-Content "$root\Updater\AutoUpdateController.cs" -Raw
          $mainCode = Get-Content "$root\Views\MainWindow.xaml.cs" -Raw
          $settings = Get-Content "$root\UserControls\SettingsControl.xaml" -Raw
          $settingsObject = Get-Content "$root\Common\UserSettings\SettingsObject.cs" -Raw
          $appConfig = Get-Content "$root\App.config" -Raw
          $settingsDefinition = Get-Content "$root\Properties\Settings.settings" -Raw
          $settingsDesigner = Get-Content "$root\Properties\Settings.Designer.cs" -Raw
          $releaseScript = Get-Content ".\scripts\publi-icc-v060.ps1" -Raw
          $projectFileText = Get-Content "$root\StatisticsAnalysisTool.csproj" -Raw
          $assemblyInfoText = Get-Content "$root\Properties\AssemblyInfo.cs" -Raw
          $productionFeedText = Get-Content "$root\imortais-netsparkle-update-check.xml" -Raw
          $readmeText = Get-Content ".\README.md" -Raw
          $rcPrepare = Get-Content ".\scripts\prepare-icc-v060-local-rc.ps1" -Raw
          $rcTest = Get-Content ".\scripts\test-icc-v060-local-update.ps1" -Raw
          $installerIss = Get-Content ".\upstream\AlbionOnline-StatisticsAnalysis\.github\installers\release-installer.iss" -Raw
          $appCode = Get-Content "$root\App.xaml.cs" -Raw
          $highlightEncoder = Get-Content "$root\Imortais\Highlights\HardwareH264SinkEncoder.cs" -Raw
          $highlightAudio = Get-Content "$root\Imortais\Highlights\AlbionProcessAudioCapture.cs" -Raw
          $highlightPacer = Get-Content "$root\Imortais\Highlights\FramePacer.cs" -Raw
          $highlightSession = Get-Content "$root\Imortais\Highlights\WindowsHighlightCaptureSession.cs" -Raw
          $highlightWriter = Get-Content "$root\Imortais\Highlights\Mp4PassthroughWriter.cs" -Raw
          $highlightPcm = Get-Content "$root\Imortais\Highlights\PcmAudioRing.cs" -Raw
          $highlightTrigger = Get-Content "$root\Imortais\Highlights\HighlightTriggerService.cs" -Raw
          $highlightStorage = Get-Content "$root\Imortais\Highlights\HighlightStorageManager.cs" -Raw
          $highlightRecorder = Get-Content "$root\Imortais\Highlights\HighlightRecorderService.cs" -Raw
          $diedHandler = Get-Content "$root\Network\Handler\DiedEventHandler.cs" -Raw

          if ($main -notmatch '<TabItem Header="IMORTAIS"') { throw "IMORTAIS home tab missing." }
          if ($main.IndexOf('<TabItem Header="IMORTAIS"') -gt $main.IndexOf('DashboardTabVisibility')) { throw "IMORTAIS is not the first visible tab." }
          if ($bridge -notmatch 'lootedByGuild') { throw "Canonical loot guild telemetry missing." }
          if ($bridge -notmatch '/api/telemetry/context') { throw "CTA context integration missing." }
          if ($bridge -notmatch 'PersistQueuedEventsAsync') { throw "Persistent outbox worker missing." }
          if ($config -notmatch 'outbox\.ndjson') { throw "Persistent outbox path missing." }
          if ($loot -notmatch 'lootedByUser\?\.Value\?\.Guild') { throw "LootController is not forwarding looter guild." }
          if (Test-Path ".\src\StatisticsAnalysisTool\Imortais\*.cs") { throw "Legacy live Imortais copy returned." }
          if (Test-Path ".\patched\Network\Manager\*.cs") { throw "Legacy patched controllers returned." }
          if ($updater -match 'HttpClientUtils\.IsUrlAccessible') { throw "Updater HEAD preflight regression returned." }
          if ($updater -notmatch 'ShowStartupUpdatePromptIfAvailableAsync') { throw "Startup update prompt is no longer decoupled from detection." }
          if ($updater -match 'UpdateCheckSource\.Manual or UpdateCheckSource\.Startup') { throw "Startup modal was coupled back into update detection." }
          if ($updater -notmatch 'RelaunchAfterUpdate\s*=\s*true') { throw "Updater must relaunch Combat Client after installation." }
          if ($updater -notmatch 'LastUpdateCheckStatus') { throw "Updater diagnostic state missing." }
          if ($bridge -notmatch 'PendingEvents') { throw "Outbox diagnostics missing from bridge status." }
          if ($main -notmatch 'ImortaisDiagnosticsOutboxText') { throw "IMORTAIS diagnostics panel missing." }
          if ($main -notmatch 'ImortaisBackgroundRecordingButton') { throw "IMORTAIS background recording toggle missing." }
          if ($mainCode -notmatch 'ImortaisBackgroundRecording_Click') { throw "IMORTAIS background recording handler missing." }
          if ($settingsObject -notmatch 'IsImortaisBackgroundRecordingEnabled') { throw "IMORTAIS background recording setting missing." }
          if ($mainCode -notmatch 'SaveSettingsAsync') { throw "IMORTAIS background recording preference is not persisted." }
          if ($highlightEncoder -match 'writer\.AddStream\(') { throw "Sample Grabber sink has fixed streams; SinkWriter.AddStream must not be used." }
          if ($highlightEncoder -notmatch 'GetStreamSinkByIndex\(0\)') { throw "Highlights encoder must reuse the fixed Sample Grabber stream." }
          if ($highlightEncoder -notmatch 'const int stream\s*=\s*0') { throw "Highlights SinkWriter must address the single fixed stream by zero-based index 0." }
          if ($highlightAudio -notmatch 'WithProcessLoopback') { throw "Highlights audio must use per-process loopback." }
          if ($highlightAudio -match 'WithLoopbackCapture|WasapiLoopbackCapture') { throw "Highlights audio must never fall back to global system loopback." }
          if ($highlightPacer -notmatch 'minimumAcceptInterval100Ns') { throw "Highlights interval pacing guard missing." }
          if ($highlightPacer -match 'lastAcceptedSlot|slot \* _frameDuration100Ns') { throw "Highlights pacer regressed to fixed-slot timestamp quantization." }
          if ($highlightSession -notmatch 'while\(true\).*TryGetNextFrame' -and $highlightSession -notmatch 'while\(true\)[\s\S]*TryGetNextFrame') { throw "WGC frame-pool drain loop missing." }
          if ($highlightSession -notmatch 'SetMultithreadProtected\(true\)') { throw "D3D11 multithread protection missing." }
          if ($highlightEncoder -notmatch 'CodecBPictureCount,0u') { throw "H.264 B-frames must stay disabled." }
          if ($highlightEncoder -notmatch 'SetInputMediaType\(stream,inputType,encodingParameters\)') { throw "Explicit encoder parameters missing." }
          if ($highlightEncoder -notmatch 'CodecLowLatencyMode,true') { throw "H.264 low-latency mode missing." }
          if ($highlightPcm -notmatch 'TimestampJitterTolerance100Ns=30\*TimeSpan\.TicksPerMillisecond') { throw "PCM timestamp jitter tolerance missing." }
          if ($diedHandler -notmatch 'HighlightTriggerKind\.Abate' -or $diedHandler -notmatch 'value\.IsLethal') { throw "Marco 2 lethal personal abate hook missing." }
          if ($diedHandler -match 'HighlightTriggerKind\.Death') { throw "Marco 2 must not autosave local-player deaths." }
          if ($highlightRecorder -notmatch 'ConcurrentQueue<HighlightTrigger>') { throw "Marco 2 trigger path must remain non-blocking and queued." }
          if ($highlightRecorder -notmatch 'MaxDetachedSnapshots=2' -or $highlightRecorder -notmatch 'MaxTriggerInbox=512') { throw "Marco 2 bounded pressure guards missing." }
          if ($highlightSession -notmatch '_snapshotIdle\.Wait\(\)' -or $highlightSession -notmatch 'TryEnterSnapshotOperation') { throw "Snapshot lifetime pinning missing." }
          if ($highlightSession -notmatch 'Os rings têm locks próprios' -or $highlightSession -notmatch '_activeSnapshotOperations\+\+') { throw "Snapshot copy is not lifetime-pinned outside the lifetime gate." }
          if ($highlightStorage -notmatch 'DefaultQuotaBytes=10L\*1024\*1024\*1024') { throw "Marco 2 10 GiB quota missing." }
          if ($highlightStorage -notmatch 'MinimumFreeBytes=1L\*1024\*1024\*1024') { throw "Marco 2 1 GiB free-space guard missing." }
          if ($mainCode -notmatch 'IsImortaisAutoSaveAbatesEnabled' -or $main -notmatch 'Salvar meus abates') { throw "Marco 2 abate UI option missing." }
          if ($main -match 'Salvar minhas mortes') { throw "Marco 2 must not expose personal-death autosave yet." }
          if ($highlightWriter -notmatch 'MFStartup\(true\)' -or $highlightWriter -notmatch 'MFShutdown\(\)') { throw "MP4 writer must own an MFStartup/MFShutdown pair." }
          if ($mainCode -notmatch 'CopyImortaisDiagnostics_Click') { throw "Copy diagnostics action missing." }
          if ($settings -notmatch 'UpdateCheckStatusText') { throw "Settings update check status UI missing." }
          $imortaisFeed = 'https://raw.githubusercontent.com/cocoputiz-sudo/imortais-combat-client/main/upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool/imortais-netsparkle-update-check.xml'
          if ([regex]::Matches($appConfig, [regex]::Escape($imortaisFeed)).Count -lt 4) { throw "App.config is not consistently pointing stable/pre-release settings to the IMORTAIS feed." }
          if ($appConfig -match 'Triky313/AlbionOnline-StatisticsAnalysis/main/src/StatisticsAnalysisTool/ao-netsparkle') { throw "App.config still contains upstream Triky313 updater feeds." }
          if ([regex]::Matches($settingsDefinition, [regex]::Escape($imortaisFeed)).Count -lt 2) { throw "Settings.settings updater URLs are not IMORTAIS." }
          if ([regex]::Matches($settingsDesigner, [regex]::Escape($imortaisFeed)).Count -lt 2) { throw "Settings.Designer.cs updater defaults are not IMORTAIS." }
          if ($releaseScript -notmatch 'CloseApplications=no') { throw "Official release installer must not invoke Inno Restart Manager during NetSparkle handoff." }
          if ($releaseScript -notmatch '#define AppExe "IMORTAIS-Combat-Client\.exe"') { throw "Official release installer executable name is wrong." }
          if ($releaseScript -notmatch 'OutputBaseFilename=IMORTAIS-Combat-Client-Setup-v\$Version') { throw "Official release asset filename is wrong." }
          if ($releaseScript -notmatch '\$Version\s*=\s*"0\.6\.0"') { throw "Official release script is not v0.6.0." }
          if ($releaseScript -notmatch '<ApplicationVersion>\\s\*0\\\.6\\\.0\\\.0' -and $releaseScript -notmatch '0\\\.6\\\.0\\\.0') { throw "v0.6.0 publisher does not validate v0.6.0 metadata." }
          if ($releaseScript -match '0\\\.5\\\.9\\\.0') { throw "v0.6.0 publisher still contains a stale v0.5.9 metadata regex." }
          if ($releaseScript -notmatch 'ContextRefreshInterval' -or $releaseScript -notmatch 'HighlightTriggerKind\\\.Abate') { throw "v0.6.0 publisher lacks telemetry/highlight release guards." }
          if ($releaseScript -notmatch 'player_presence_snapshot') { throw "Official release script does not validate player presence snapshot." }
          if ($projectFileText -notmatch '<ApplicationVersion>0\.6\.0\.0</ApplicationVersion>') { throw "ApplicationVersion is not 0.6.0.0." }
          if ($assemblyInfoText -notmatch 'AssemblyFileVersion\("0\.6\.0\.0"\)' -or $assemblyInfoText -notmatch 'AssemblyInformationalVersion\("0\.6\.0"\)') { throw "Assembly versions are not v0.6.0." }
          if ($bridge -notmatch 'ClientVersion\s*=\s*"0\.6\.0"') { throw "Telemetry ClientVersion is not 0.6.0." }
          if ($settingsObject -match 'IsImortaisAutoSaveDeathsEnabled') { throw "Reserved death autosave setting must be removed before v0.6.0." }
          if ($settingsObject -notmatch 'IsImortaisBackgroundRecordingEnabled\s*\{\s*get;\s*set;\s*\}\s*=\s*false') { throw "Background recording must default to OFF." }
          if ($productionFeedText -match 'v0\.6\.0' -or $productionFeedText -notmatch 'v0\.5\.9') { throw "Production feed must remain on v0.5.9 during RC preparation." }
          if ($readmeText -notmatch 'Versão publicada atual:\*\* v0\.5\.9') { throw "README must keep v0.5.9 as the published version before release approval." }
          if ($rcPrepare -notmatch '127\.0\.0\.1' -or $rcTest -notmatch '127\.0\.0\.1') { throw "RC localhost helpers must stay loopback-only." }
          if ($rcTest -notmatch '\.signature' -or $rcTest -notmatch '--verify') { throw "RC helper must verify XML .signature before testing." }
          if ($updater -notmatch 'ShouldKillParentProcessWhenStartingInstaller\s*=\s*true') { throw "Updater does not explicitly wait for client shutdown before installer handoff." }
          if ($installerIss -notmatch '#define MyAppExeName "IMORTAIS-Combat-Client\.exe"') { throw "Legacy installer still targets the upstream executable." }
          if ($appCode -notmatch 'IMORTAISCombatClient_D842B07173EA42BFB36E3FD6C2F1A940') { throw "Application mutex for installer detection is missing." }
          if ($bridge -notmatch 'GuildPresenceProbe') { throw "Guild Presence Collector missing from bridge." }
          if ($bridge -notmatch 'guild_presence_probe') { throw "guild_presence_probe telemetry type missing." }
          if ($bridge -notmatch 'player_presence_snapshot') { throw "Player presence snapshot telemetry missing." }
          if ($bridge -notmatch 'NearbyPlayerObserved') { throw "NewCharacter presence collector missing from bridge." }
          $newCharacterHandler = Get-Content "$root\Network\Handler\NewCharacterEventHandler.cs" -Raw
          $leaveHandler = Get-Content "$root\Network\Handler\LeaveEventHandler.cs" -Raw
          if ($newCharacterHandler -notmatch 'NearbyPlayerObserved') { throw "NewCharacter handler is not feeding player presence." }
          if ($leaveHandler -notmatch 'NearbyPlayerLeft') { throw "Leave handler is not closing player presence." }
          if ($main -notmatch 'IMORTAIS COMBAT CLIENT') { throw "IMORTAIS UI branding missing." }
          $presenceHandler = Get-Content "$root\Network\Handler\ImortaisGuildPresenceProbeEventHandler.cs" -Raw
          $networkManager = Get-Content "$root\Network\NetworkManager.cs" -Raw
          if ($presenceHandler -notmatch 'ImortaisGuildPresenceProbeEventHandler') { throw "Guild presence handler missing." }
          foreach ($eventName in @('GuildUpdate','GuildPlayerUpdated','GuildMemberWorldUpdate','GuildMemberTerritoryUpdate')) {
              if ($networkManager -notmatch [regex]::Escape("EventCodes.$eventName")) { throw "Guild presence event $eventName is not registered." }
          }

      - name: Validate v0.6.0 release and RC helper script syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ".\scripts\publi-icc-v060.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "publi-icc-v060.ps1 has PowerShell syntax errors."
          }
          foreach ($script in @(".\scripts\prepare-icc-v060-local-rc.ps1",".\scripts\test-icc-v060-local-update.ps1")) {
            $scriptErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$null,[ref]$scriptErrors) | Out-Null
            if ($scriptErrors.Count -gt 0) {
              $scriptErrors | ForEach-Object { Write-Error $_.Message }
              throw "$script has PowerShell syntax errors."
            }
          }

      - name: Highlights logic
        shell: pwsh
        run: dotnet run --project .\tests\Highlights.LogicTests\Highlights.LogicTests.csproj -c Release

      - name: Build fork Release
        shell: pwsh
        run: dotnet build .\upstream\AlbionOnline-StatisticsAnalysis\src\StatisticsAnalysisTool\StatisticsAnalysisTool.csproj -c Release --no-incremental

      - name: Publish v0.6.0 RC ZIP
        shell: pwsh
        run: |
          $project = ".\upstream\AlbionOnline-StatisticsAnalysis\src\StatisticsAnalysisTool\StatisticsAnalysisTool.csproj"
          $out = Join-Path $env:RUNNER_TEMP "imortais-v060-rc"
          $zip = Join-Path $env:RUNNER_TEMP "IMORTAIS-Combat-Client-v0.6.0-rc-win-x64.zip"
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          dotnet publish $project -c Release -r win-x64 --self-contained true -p:LocalInstallerBuild=true -o $out
          $exe = Join-Path $out "IMORTAIS-Combat-Client.exe"
          if (-not (Test-Path $exe)) { throw "RC executable missing." }
          $vi = (Get-Item $exe).VersionInfo
          if ($vi.FileVersion -notlike "0.6.0*") { throw "RC executable FileVersion is not 0.6.0: $($vi.FileVersion)" }
          Write-Host "RC_FILE_VERSION=$($vi.FileVersion)"
          Write-Host "RC_PRODUCT_VERSION=$($vi.ProductVersion)"
          Compress-Archive -Path "$out\*" -DestinationPath $zip -CompressionLevel Optimal
          $size = (Get-Item $zip).Length
          $baseline = 153024966
          $delta = $size - $baseline
          $pct = if ($baseline -gt 0) { [math]::Round(($delta / $baseline) * 100, 2) } else { 0 }
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "RC_ZIP_PATH=$zip" >> $env:GITHUB_ENV
          "RC_ZIP_BYTES=$size" >> $env:GITHUB_ENV
          Write-Host "RC_ZIP_BYTES=$size"
          Write-Host "RC_ZIP_DELTA_BYTES=$delta"
          Write-Host "RC_ZIP_DELTA_PCT=$pct"
          Write-Host "RC_ZIP_SHA256=$sha"
          "### IMORTAIS Combat Client v0.6.0 RC artifact" >> $env:GITHUB_STEP_SUMMARY
          "- baseline v0.5.9 ZIP: **$baseline bytes**" >> $env:GITHUB_STEP_SUMMARY
          "- RC ZIP: **$size bytes**" >> $env:GITHUB_STEP_SUMMARY
          "- delta: **$delta bytes ($pct%)**" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: $sha" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload v0.6.0 RC package
        uses: actions/upload-artifact@v4
        with:
          name: IMORTAIS-Combat-Client-v0.6.0-rc-win-x64
          path: |
            ${{ env.RC_ZIP_PATH }}
            scripts/prepare-icc-v060-local-rc.ps1
            scripts/test-icc-v060-local-update.ps1
            docs/RC-v0.6.0.md
          if-no-files-found: error
          retention-days: 14
