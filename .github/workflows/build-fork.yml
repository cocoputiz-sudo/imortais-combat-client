name: Build v0.6.2 Candidate (sem publicacao)

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout do commit da branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Conferir versao v0.6.2 e proteger feed publico
        shell: pwsh
        run: |
          $root = "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool"
          $project = Get-Content "$root/StatisticsAnalysisTool.csproj" -Raw
          $assembly = Get-Content "$root/Properties/AssemblyInfo.cs" -Raw
          $bridge = Get-Content "$root/Imortais/ImortaisEventBridge.cs" -Raw
          $feed = Get-Content "$root/imortais-netsparkle-update-check.xml" -Raw
          if ($project -notmatch '<ApplicationVersion>0\.6\.2\.0</ApplicationVersion>') { throw "csproj is not v0.6.2" }
          if ($assembly -notmatch 'AssemblyFileVersion\("0\.6\.2\.0"\)') { throw "assembly is not v0.6.2" }
          if ($bridge -notmatch 'ClientVersion = "0\.6\.2"') { throw "telemetry version mismatch" }
          # Refuse any appcast modification, regardless of public release version.
          git fetch origin main --depth=1
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch main" }
          $feedDiff = git diff --name-only origin/main HEAD -- "$root/imortais-netsparkle-update-check.xml"
          if ($feedDiff) { throw "Candidate cannot modify production appcast" }
          if ($feed -notmatch 'sparkle:version="[^"]+"') { throw "Invalid public appcast" }
          Write-Host "Candidate appcast identical to main; no release"

      - name: Validar PowerShell do publicador oficial e opt-ins desligados
        shell: pwsh
        run: |
          foreach ($name in @("publi-icc-v062.ps1","resume-icc-v062.ps1")) {
            $tokens = $null
            $errors = $null
            $script = (Resolve-Path (".\scripts\" + $name)).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Host
              throw ("PowerShell publicador com erros de sintaxe: " + $name)
            }
            $source = Get-Content -LiteralPath $script -Raw
            if ($source -notmatch '--notes-file') { throw "gh release create precisa usar notes-file: $name" }
          }
          $root = ".\\upstream\\AlbionOnline-StatisticsAnalysis\\src\\StatisticsAnalysisTool"
          $settings = Get-Content "$root\\Common\\UserSettings\\SettingsObject.cs" -Raw
          $storage = Get-Content "$root\\Imortais\\Highlights\\HighlightStorageManager.cs" -Raw
          $ui = Get-Content "$root\\Views\\MainWindow.xaml" -Raw
          $bridge = Get-Content "$root\\Imortais\\ImortaisEventBridge.cs" -Raw
          if ($settings -notmatch 'IsImortaisAutoSaveDeathsEnabled.*false' -or $settings -notmatch 'IsImortaisAutoSaveMassAbatesEnabled.*false') { throw "Morte/massa devem iniciar desmarcados" }
          if ($settings -notmatch 'IsImortaisAutoSaveAbatesEnabled.*true') { throw "Salvar meus abates não foi preservado" }
          if (($storage.Split("private long CalculateUsedBytes()").Count -ne 2) -or (-not $storage.Split("private long CalculateUsedBytes()")[1].Contains("SearchOption.AllDirectories"))) { throw "Quota não inclui subpastas" }
          if ($ui -notmatch 'ImortaisAutoSaveMassAbatesCheckBox' -or $ui -notmatch 'ImortaisAutoSaveDeathsCheckBox') { throw "Caixas opt-in ausentes" }
          if ($bridge -notmatch 'credentialMode' -or $bridge -notmatch 'rankingEligible') { throw "Estado de pareamento não integrado" }
          Write-Host "PASS: publicador PowerShell, defaults, quota recursiva e pareamento"

      - name: Carimbar commit Git real no cliente
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $sha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($sha -ne $env:EXPECTED_SHA.ToLowerInvariant()) { throw "Checkout does not match event SHA" }
          if ($sha -notmatch '^[a-f0-9]{40}$') { throw "Invalid Git SHA" }
          $target = "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool/Imortais/ImortaisBuildIdentity.cs"
          $code = 'namespace StatisticsAnalysisTool.Imortais; public static class ImortaisBuildIdentity { public const string Version = "v0.6.2"; public const string Commit = "PLACEHOLDER_SHA"; public static string Display => Version + " commit " + Commit; }'
          $code = $code.Replace("PLACEHOLDER_SHA",$sha)
          [System.IO.File]::WriteAllText($target,$code,[System.Text.UTF8Encoding]::new($false))
          Write-Host "BUILD_SHA=$sha"

      - name: Compilar Combat Client Windows
        shell: pwsh
        run: |
          $project = ".\upstream\AlbionOnline-StatisticsAnalysis\src\StatisticsAnalysisTool\StatisticsAnalysisTool.csproj"
          dotnet build $project -c Release --no-incremental
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed" }

      - name: Testar códigos Photon, PT e diagnóstico
        shell: pwsh
        run: |
          dotnet test .\\upstream\\AlbionOnline-StatisticsAnalysis\\src\\StatisticsAnalysisTool.UnitTests\\StatisticsAnalysisTool.UnitTests.csproj -c Release --filter "FullyQualifiedName~PartyJoinedEventTests|FullyQualifiedName~PhotonEventDiagnosticsCollectorTests|FullyQualifiedName~EventCodesOrdinalRegressionTests"
          if ($LASTEXITCODE -ne 0) { throw "PartyJoinedEventTests failed" }

      - name: Executar testes de Highlights
        shell: pwsh
        run: |
          dotnet run --project .\tests\Highlights.LogicTests\Highlights.LogicTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw "Highlights logic tests failed" }

      - name: Publicar executavel v0.6.2 autocontido (nao distribuido)
        shell: pwsh
        run: |
          $project = ".\upstream\AlbionOnline-StatisticsAnalysis\src\StatisticsAnalysisTool\StatisticsAnalysisTool.csproj"
          $out = Join-Path $env:RUNNER_TEMP "imortais-v062-app"
          dotnet publish $project -c Release -r win-x64 --self-contained true -p:LocalInstallerBuild=true -o $out
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }
          $exe = Join-Path $out "IMORTAIS-Combat-Client.exe"
          if (-not (Test-Path $exe)) { throw "No executable published" }
          if ((Get-Item $exe).VersionInfo.FileVersion -notlike '0.6.2*') { throw "Version not embedded" }
          "APP_DIR=$out" >> $env:GITHUB_ENV

      - name: Gerar instalador normal v0.6.2
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "imortais-v062-setup"
          .\scripts\build-icc-v062-candidate.ps1 -AppDir "$env:APP_DIR" -OutDir $package
          if ($LASTEXITCODE -ne 0) { throw "Inno setup failed" }
          "PACKAGE_DIR=$package" >> $env:GITHUB_ENV

      - name: Testar atualização real v0.6.1 -> v0.6.2 e preservar pareamento
        shell: pwsh
        run: |
          $setup = Join-Path $env:PACKAGE_DIR "IMORTAIS-Combat-Client-Setup-v0.6.2.exe"
          .\scripts\test-icc-v062-upgrade.ps1 -CandidateSetup $setup
          # PowerShell throws on failures; LASTEXITCODE may be stale from Inno Setup.

      - name: Anexar instalador v0.6.2 para conferência, sem Release
        uses: actions/upload-artifact@v4
        with:
          name: IMORTAIS-Combat-Client-Setup-v0.6.2
          path: ${{ env.PACKAGE_DIR }}\*
          if-no-files-found: error
          retention-days: 14
