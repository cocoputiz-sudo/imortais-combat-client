name: Build Linux Combat Client

on:
  workflow_dispatch:
  push:
    branches:
      - feat/linux-client-v010
    paths:
      - "src/Imortais.LinuxClient/**"
      - "scripts/build-linux-deb.sh"
      - "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool.PhotonPackageParser/**"
      - "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool.Protocol18/**"
      - "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool.Abstractions/**"
      - "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool.Diagnostics/**"
      - ".github/workflows/build-linux-client.yml"
  pull_request:
    branches:
      - feat/linux-client-v010
    paths:
      - "src/Imortais.LinuxClient/**"
      - "scripts/build-linux-deb.sh"
      - "docs/LINUX-CLIENT.md"
      - ".github/workflows/build-linux-client.yml"

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libcap2-bin dpkg-dev

      - name: Restore
        run: dotnet restore src/Imortais.LinuxClient/Imortais.LinuxClient.csproj

      - name: Validate v0.5.9 telemetry parity
        shell: bash
        run: |
          set -euo pipefail
          RX="src/Imortais.LinuxClient/Network/LinuxPhotonReceiver.cs"
          WIN="src/Imortais.LinuxClient/MainWindow.cs"
          grep -q 'case Leave:' "$RX"
          grep -q '"player_presence_snapshot"' "$RX"
          grep -q '"zone_change"' "$RX"
          grep -q '\["playerId"\]' "$RX"
          grep -q '\["alliance"\]' "$RX"
          grep -q '\["snapshotIntervalMs"\] = 15000' "$RX"
          grep -q 'EmitPlayerPresenceSnapshot' "$WIN"

      - name: Build
        run: dotnet build src/Imortais.LinuxClient/Imortais.LinuxClient.csproj -c Release --no-restore

      - name: Build .deb
        run: bash scripts/build-linux-deb.sh 0.1.1

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: IMORTAIS-Combat-Client-v0.1.1-linux-x64
          path: |
            dist/linux/*.deb
            dist/linux/*.sha256
          if-no-files-found: error

      - name: Publish Linux pre-release
        if: github.ref == 'refs/heads/feat/linux-client-v010'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.1-linux-preview.3"

          cat > /tmp/linux-release-notes.md <<'EOF'
          Preview 3 do IMORTAIS Combat Client nativo para Ubuntu/Linux. Corrige a captura real no Ubuntu: remontagem de IPv4 fragmentado, suporte a Ethernet/raw/SLL/SLL2, diagnóstico automático de interfaces e tráfego Photon, e instalador que valida as capabilities de captura.

          Inclui GUI Avalonia com abas Início, Registro, Medidor de dano, Party e Configurações; ativação por código do War Room; captura libpcap; parser Photon; outbox; party_snapshot; combat_delta; player_death_observed; atalho no menu do Ubuntu e pacote .deb amd64.

          Build validado automaticamente em Ubuntu 24.04. Esta é uma versão Preview para teste antes de integrar à main.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/linux/*.deb dist/linux/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG"               dist/linux/*.deb               dist/linux/*.sha256               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --prerelease               --title "IMORTAIS Combat Client Linux v0.1.1 Preview 3"               --notes-file /tmp/linux-release-notes.md
          fi
