name: Build Linux Combat Client

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - feat/linux-alpha-dragonfire-20261013
      - fix/linux-export-updater-session-20261013
    paths:
      - "src/Imortais.LinuxClient/**"
      - "src/Imortais.LinuxClient.ContractTests/**"
      - "scripts/build-linux-deb.sh"
      - "scripts/generate-linux-world-map-names.mjs"
      - "docs/LINUX-CLIENT.md"
      - "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool.PhotonPackageParser/**"
      - "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool.Protocol18/**"
      - "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool.Abstractions/**"
      - "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool.Diagnostics/**"
      - ".github/workflows/build-linux-client.yml"
  push:
    branches:
      - main
      - feat/linux-alpha-dragonfire-20261013
    paths:
      - "src/Imortais.LinuxClient/**"
      - "src/Imortais.LinuxClient.ContractTests/**"
      - "scripts/build-linux-deb.sh"
      - "scripts/generate-linux-world-map-names.mjs"
      - "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool.PhotonPackageParser/**"
      - "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool.Protocol18/**"
      - "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool.Abstractions/**"
      - "upstream/AlbionOnline-StatisticsAnalysis/src/StatisticsAnalysisTool.Diagnostics/**"
      - ".github/workflows/build-linux-client.yml"

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libcap2-bin dpkg-dev

      - name: Restore
        run: dotnet restore src/Imortais.LinuxClient/Imortais.LinuxClient.csproj

      - name: Validate Linux telemetry contract
        run: dotnet run --project src/Imortais.LinuxClient.ContractTests/Imortais.LinuxClient.ContractTests.csproj -c Release

      - name: Build
        run: dotnet build src/Imortais.LinuxClient/Imortais.LinuxClient.csproj -c Release --no-restore

      - name: Build .deb
        run: bash scripts/build-linux-deb.sh '0.2.0~alpha2' '0.2.0-alpha.2'

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: IMORTAIS-Combat-Client-v0.2.0-alpha.2-linux-x64
          path: |
            dist/linux/*.deb
            dist/linux/*.sha256
          if-no-files-found: error

      - name: Verify Debian alpha and capabilities installation
        run: |
          set -euo pipefail
          cd dist/linux
          sha256sum -c *.sha256
          DEB="$(find . -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Package)" = "imortais-combat-client"
          test "$(dpkg-deb -f "$DEB" Version)" = "0.2.0~alpha2"
          sudo apt-get install -y "./${DEB#./}"
          test -x /opt/imortais-combat-client/IMORTAIS-Combat-Client
          getcap /opt/imortais-combat-client/IMORTAIS-Combat-Client | grep -q "cap_net_raw"
          getcap /opt/imortais-combat-client/IMORTAIS-Combat-Client | grep -q "cap_net_admin"
          test -f /usr/share/applications/imortais-combat-client.desktop
          test -f /opt/imortais-combat-client/linux-build.json
          grep -q \"buildNumber\" /opt/imortais-combat-client/linux-build.json
          echo "PASS: Debian alpha installed with capabilities and desktop shortcut"

      - name: Smoke-test GUI as normal user on virtual desktop
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb
          set +e
          timeout 15s xvfb-run -a /usr/bin/imortais-combat-client --background > /tmp/imortais-alpha-gui.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat /tmp/imortais-alpha-gui.log
            echo "Alpha GUI exited unexpectedly: $status"
            exit 1
          fi
          echo "PASS: Avalonia GUI stayed alive 15s as unprivileged user"

      - name: Publish Linux alpha pre-release from isolated branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/linux-alpha-dragonfire-20261013'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.2.0-linux-alpha.${GITHUB_RUN_NUMBER}"
          cat > /tmp/linux-alpha-notes.md <<'EOF'
          # IMORTAIS Combat Client Linux 0.2.0 Alpha

          **Dragonfire Patch 3 (Albion 12/10/2026):** realinha os códigos Photon com o Windows; corrige recepção via parâmetro 252, party, dano/cura, mortes e loot.
          - GUI Avalonia: Início, Registros, Medidor de dano, Party, Configurações
          - Diagnóstico Photon anônimo: exportação com fallback sem XDG portal
          - Verificação, download SHA-256 e instalação de atualizações diretamente na GUI
          - Painel de sessão com contadores de PT, loot, mortes e eventos Photon
          - Captura libpcap com IPv4 fragmentado, SLL/SLL2 e permissões aplicadas durante instalação
          - Party atualizada atomicamente e republicada ao trocar CTA
          - Dados e pareamento preservados em ~/.config/imortais-combat-client e ~/.local/state/imortais-combat-client
          - Arquivo .deb amd64 + SHA-256, não altera v0.6.2 do Windows

          **ALPHA EXPERIMENTAL:** o código compila e passa testes no Ubuntu 24.04, mas a captura real e o instalador em Ubuntu 22.04/24.04 de jogadores ainda devem ser homologados.
          O Linux ainda não grava vídeo Highlights. Em loot, o índice do item é enviado como ITEM_INDEX_N e valor 0 até integrar o catálogo de itens.
          Instalar abrindo o pacote .deb com instalador gráfico do Ubuntu; o jogo precisa estar aberto para observar o tráfego. Não é necessário rodar comandos de diagnóstico.
          EOF
          gh release create "$TAG" dist/linux/*.deb dist/linux/*.sha256             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease             --title "IMORTAIS Combat Client Linux 0.2.0 Alpha ${GITHUB_RUN_NUMBER}"             --notes-file /tmp/linux-alpha-notes.md
